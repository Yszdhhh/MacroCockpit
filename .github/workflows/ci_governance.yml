name: MacroCockpit Architecture & Governance Gate

on:
  push:
    branches: [ main, master, refactor/* ]
  pull_request:
  workflow_dispatch:

jobs:
  governance-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies and Ruff
        run: python -m pip install --upgrade pip && pip install -r requirements.txt ruff

      - name: Check JS syntax
        run: node --check web/app.js && node --check desktop/ui/app.js

      - name: Build single-file offline HTML bundle
        run: python -m backend.server --build-static

      - name: Run architecture governance, SSOT, and contract gates
        run: |
          python -m ruff check --no-cache --select F821,F401,F811,F541 backend desktop
          python -m pytest tests/test_architecture_governance.py tests/test_foundation_ssot.py tests/test_portfolio_contract.py tests/test_mcp_contract.py -q
